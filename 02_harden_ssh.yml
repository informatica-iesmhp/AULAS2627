---
# 02_harden_ssh.yml
# ---------------------------------------------------------------------------
# PASO 2 de 2. Ejecutar SOLO después de confirmar (con "ansible ... -m ping"
# usando ya la clave, sin --ask-pass) que TODOS los equipos aceptan la
# conexión por clave. Este playbook ya no necesita --ask-pass: se conecta
# usando la clave recién desplegada.
#
# Qué hace:
#   1) Desactiva la autenticación por contraseña en sshd (solo quedará
#      entrada por clave).
#   2) Bloquea la contraseña local de ansible-admin como segunda capa
#      (aunque alguien reactivara PasswordAuthentication a mano, la
#      contraseña ya no serviría).
#
# Uso (como ansible-admin, desde ~/ansible-aulas):
#   ansible-playbook -i inventarios/aula1.ini playbooks/02_harden_ssh.yml -u ansible-admin
# ---------------------------------------------------------------------------

- name: Desactivar acceso SSH por contraseña
  hosts: all
  become: true

  tasks:
    - name: Forzar solo autenticación por clave en sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication\s'
        line: "PasswordAuthentication no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: recargar ssh

    - name: Bloquear la contraseña local de ansible-admin (segunda capa)
      ansible.builtin.user:
        name: ansible-admin
        password_lock: true

  handlers:
    - name: recargar ssh
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

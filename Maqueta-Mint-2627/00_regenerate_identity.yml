---
# 00_regenerate_identity.yml
# ---------------------------------------------------------------------------
# PASO 0 (antes de 01_bootstrap_keys.yml). Se ejecuta UNA VEZ, justo después
# de clonar/desplegar los equipos, usando todavía la contraseña temporal de
# ansible-admin.
#
# Qué hace:
#   1) Regenera /etc/machine-id (systemd) - todos los clones nacen con el
#      mismo, hay que darle uno único a cada equipo.
#   2) Regenera las claves de host de SSH - todos los clones nacen con la
#      MISMA clave privada de host; si no se arregla, cualquiera con acceso
#      a un equipo podría suplantar a cualquier otro del aula.
#
# Uso (como ansible-admin, desde ~/ansible-aulas, con el inventario de esa aula):
#
#   ansible-playbook -i inventarios/aula1.ini playbooks/00_regenerate_identity.yml \
#       --ask-pass -u ansible-admin \
#       --ssh-common-args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
#
# El --ssh-common-args es necesario porque, al ser todos los equipos clones
# recién llegados (y además vamos a CAMBIARLES la clave de host en este
# mismo playbook), no tiene sentido validar esa clave todavía.
# ---------------------------------------------------------------------------

- name: Regenerar identificadores únicos tras el clonado
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Regenerar machine-id
      block:
        - name: Vaciar /etc/machine-id
          ansible.builtin.copy:
            content: ""
            dest: /etc/machine-id
            mode: "0444"

        - name: Comprobar si el machine-id de D-Bus es un symlink
          ansible.builtin.stat:
            path: /var/lib/dbus/machine-id
          register: dbus_machine_id

        - name: Eliminar machine-id de D-Bus si NO es symlink (archivo propio duplicado)
          ansible.builtin.file:
            path: /var/lib/dbus/machine-id
            state: absent
          when:
            - dbus_machine_id.stat.exists
            - not dbus_machine_id.stat.islnk

        - name: Regenerar machine-id ahora (sin esperar al próximo reinicio)
          ansible.builtin.command: systemd-machine-id-setup
          changed_when: true

        - name: Enlazar machine-id de D-Bus si hiciera falta
          ansible.builtin.file:
            src: /etc/machine-id
            dest: /var/lib/dbus/machine-id
            state: link
          when: not dbus_machine_id.stat.exists or not dbus_machine_id.stat.islnk

    - name: Regenerar claves de host de SSH
      block:
        - name: Borrar claves de host existentes (compartidas entre clones)
          ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
          changed_when: true

        - name: Generar claves de host nuevas y únicas
          ansible.builtin.command: ssh-keygen -A
          changed_when: true

        - name: Reiniciar sshd para que use las claves nuevas
          ansible.builtin.systemd:
            name: ssh
            state: restarted

    - name: Mostrar la huella de la nueva clave de host (ed25519)
      ansible.builtin.command: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
      register: new_fingerprint
      changed_when: false

    - name: Informar
      ansible.builtin.debug:
        msg: "Identidad regenerada en {{ inventory_hostname }}: {{ new_fingerprint.stdout }}"

- name: Aviso final
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Recordatorio
      ansible.builtin.debug:
        msg: >-
          Identificadores regenerados. Ahora ejecuta
          playbooks/01_bootstrap_keys.yml para copiar la clave pública
          (todavía con --ask-pass, la contraseña sigue siendo la temporal).

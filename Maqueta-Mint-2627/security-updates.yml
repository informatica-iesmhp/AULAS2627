---
- name: Instalar actualizaciones de seguridad
  hosts: all
  become: true
  tasks:

    - name: Actualizar caché de paquetes
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar solo actualizaciones de seguridad
      apt:
        upgrade: dist
        default_release: "{{ ansible_distribution_release }}-security"

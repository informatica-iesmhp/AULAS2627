---
# 06_montar_comparte_aula_alumnos.yml
# Aulas IF01 / IF02 / IF03 — equipos de ALUMNOS (nunca el del profesor)
#
# El recurso comparte-aula vive físicamente en el segundo disco del
# equipo del profesor (preparado con preparar_comparte_aula_profesor.sh,
# que instala y comparte por Samba esa carpeta). Este playbook NO crea
# nada en el profesor — solo monta ese recurso de red, ya publicado, en
# /comparte-aula en cada equipo de alumnos del aula.
#
# Los permisos reales (escritura en la raíz de comparte-aula, solo
# lectura en ISO y MV) los aplica el ACL del propio equipo del profesor,
# a través de la cuenta local de invitado que usa Samba ahí — este
# playbook no tiene que preocuparse de ellos.
#
# CÓMO SE MONTA: el recurso está publicado en modo INVITADO (guest) —
# sin usuario ni contraseña, y sin necesidad de que el equipo que se
# conecta esté unido al dominio (a propósito, para que valga también,
# por ejemplo, para el portátil personal de un profesor en caso de
# urgencia). Por eso este playbook no necesita ninguna cuenta ni
# contraseña: solo instala cifs-utils y monta con la opción "guest".
#
# CÓMO LANZARLO (una vez por aula, indicando su propio equipo de
# profesor):
#   ansible-playbook -i inventarios/IF01.ini playbooks/06_montar_comparte_aula_alumnos.yml \
#       -u ansible-admin --limit alumnos \
#       -e profesor_host=IF01-00
#
# (Sustituye "alumnos" por el grupo real de tu inventario si se llama
# distinto, y prueba primero con --limit en un equipo piloto.)

- name: Montar comparte-aula (red, invitado) en los equipos de alumnos
  hosts: all
  become: yes

  vars:
    samba_share_name: comparte-aula
    mount_point: /comparte-aula
    # profesor_host: hay que pasarlo con -e (p.ej. IF01-00) — sin valor
    # por defecto a propósito, para no montar por error contra el
    # profesor equivocado.

  tasks:

    - name: 1. Comprobar que se ha pasado profesor_host
      assert:
        that:
          - profesor_host is defined
        fail_msg: >-
          Falta la variable obligatoria: pasa -e profesor_host=IF0X-00
          al lanzar este playbook (el equipo del profesor de esta aula).

    - name: 2. Instalar cifs-utils
      apt:
        name: cifs-utils
        state: present
        update_cache: no
      # update_cache: no a propósito — ver nota sobre el repositorio
      # HashiCorp roto en diagnostico-bootstrap-aulas-IF01-IF04.md (sección 6).

    - name: 3. Crear el punto de montaje {{ mount_point }}
      file:
        path: "{{ mount_point }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 4. Montar //{{ profesor_host }}/{{ samba_share_name }} en {{ mount_point }} (invitado)
      mount:
        path: "{{ mount_point }}"
        src: "//{{ profesor_host }}/{{ samba_share_name }}"
        fstype: cifs
        # vers=2.0: es la versión con la que se validó el montaje en IF03
        # (08/10). OJO: el "mount error(22): Invalid argument" que daba al
        # principio NO era por la versión SMB, sino porque el Samba del
        # profesor estaba en "security = ads" sin winbind — ver
        # preparar_comparte_aula_profesor.sh y el doc del proyecto.
        #
        # file_mode=0666 / dir_mode=0777: en el equipo del alumno todo se
        # ve como de root, así que si los permisos locales fueran más
        # estrictos (p. ej. 0775), el propio cliente impediría escribir a
        # un alumno normal ANTES de llegar al servidor. Los permisos de
        # verdad (escritura en la raíz, solo lectura en ISO/MV) los aplica
        # el servidor con los ACL de la cuenta de invitado; aquí solo hay
        # que no estorbar.
        #
        # OJO: la cadena de opciones va TODA en una sola línea. Partirla
        # en dos con ">-" mete un espacio de más al unirlas, y mount.cifs
        # la rechaza — así que si lo editas, no la partas en varias líneas.
        opts: "guest,vers=2.0,uid=0,gid=0,file_mode=0666,dir_mode=0777,_netdev,x-systemd.automount"
        state: mounted
